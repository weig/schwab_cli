[project]
name = "schwab_cli"
version = "0.1.0"
description = "Charles Schwab CLI for API access"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "weig" }]
dependencies = [
    "typer>=0.12.0",
    "httpx[http2]>=0.27",
    "rich>=13.7",
    "questionary>=2.0",
    "mcp>=1.0,<2.0",  # mcp 2.0 removed Server.list_tools() — breaks mcp_server/app.py
    "websockets>=13.0",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "openpyxl>=3.1",
    "croniter>=2.0,<3.0",
    "cryptography>=43",
    "pyjwt[crypto]>=2.8",
]

[project.scripts]
schwab = "schwab_cli.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schwab_cli"]

# Copy the repo-level doc/ into the wheel so `schwab_cli <cmd> --doc`
# can find the markdown pages after `uv tool install`. The runtime
# helper (src/schwab_cli/_doc.py) first checks <repo>/doc/ for dev
# mode and falls back to this bundled location.
[tool.hatch.build.targets.wheel.force-include]
"doc" = "schwab_cli/doc"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=schwab_cli --cov-report=term-missing"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude", "doc"]

[tool.ruff.lint]
# Starting set chosen so the *current* tree passes without forced
# global rewrites. Future PRs can opt into stricter rules (UP, B, I)
# incrementally; pyflakes + the worst-of pycodestyle catches real
# bugs (undefined names, unused imports) without touching style.
select = ["E", "F", "W"]
ignore = [
    "E501",  # line-too-long
    "E701",  # multiple-statements-on-one-line-colon (typer one-liners use this)
    "E702",  # multiple-statements-on-one-line-semicolon
    "E741",  # ambiguous-variable-name (l/I/O — common in math/finance code)
    "E402",  # module-import-not-at-top — used in tests + typer subcommand wiring
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811", "F841"]  # unused imports/fixtures/vars are fine in tests
