[project]
name = "schwab_cli"
version = "0.1.0"
description = "Charles Schwab CLI for API access"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "httpx[http2]>=0.27",
    "rich>=13.7",
    "questionary>=2.0",
    "mcp>=1.0",
    "websockets>=13.0",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "openpyxl>=3.1",
]

[project.scripts]
schwab = "schwab_cli.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schwab_cli"]

# Copy the repo-level doc/ into the wheel so `schwab_cli <cmd> --doc`
# can find the markdown pages after `uv tool install`. The runtime
# helper (src/schwab_cli/_doc.py) first checks <repo>/doc/ for dev
# mode and falls back to this bundled location.
[tool.hatch.build.targets.wheel.force-include]
"doc" = "schwab_cli/doc"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=schwab_cli --cov-report=term-missing"
pythonpath = ["src"]
